<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Bin Mahmood Electronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <div class="page-head"><h1>Shop All Products</h1><p>Original products, honest prices — delivered across Pakistan.</p></div>
  <div class="shop-layout">
    <aside class="filters">
      <h4>Category</h4><div id="fCats"></div>
      <h4>Brand</h4><div id="fBrands"></div>
      <div id="sizeBlock"><h4>Size (EU)</h4><div id="fSizes"></div></div>
      <h4>Availability</h4>
      <label><input type="checkbox" id="fStock"> In stock only</label>
      <label><input type="checkbox" id="fSale"> On sale only</label>
      <button class="btn ghost" style="margin-top:16px;width:100%;justify-content:center" onclick="clearFilters()">Clear all filters</button>
    </aside>
    <div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search products…">
        <span class="count" id="count"></span>
        <select id="sort" aria-label="Sort">
          <option value="feat">Sort: Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="disc">Biggest Discount</option>
          <option value="az">Name: A to Z</option>
        </select>
      </div>
      <div class="grid" id="grid" style="grid-template-columns:repeat(3,1fr)"></div>
      <div style="text-align:center;margin-top:22px"><button class="btn ghost" id="loadMore" style="display:none" onclick="more()">Load More Products</button></div>
      <div class="empty" id="empty" style="display:none">No products match your filters.<br><button class="btn" style="margin-top:14px" onclick="clearFilters()">Clear filters</button></div>
    </div>
  </div>
</main>
<script src="data/products.js"></script>
<script src="assets/store.js"></script>
<script>
mount("shop.html");
const P = catalog();
const params = new URLSearchParams(location.search);
const state = { cats: new Set(), brands: new Set(), sizes: new Set(), stock: params.get("sale") ? false : false, sale: params.get("sale") === "1", q: params.get("q") || "", sort: "feat" };
if (params.get("cat")) state.cats.add(params.get("cat"));
function uniq(key) { return [...new Set(P.map(p => p[key]).filter(Boolean))].sort(); }
function buildFilters() {
  document.getElementById("fCats").innerHTML = uniq("category").map(c => {
    const n = P.filter(p => p.category === c).length;
    return `<label><input type="checkbox" ${state.cats.has(c) ? "checked" : ""} onchange="toggleSet(state.cats,'${esc(c)}',this.checked)"> ${esc(c)} <span style="color:var(--muted)">(${n})</span></label>`;
  }).join("");
  document.getElementById("fBrands").innerHTML = uniq("brand").map(b =>
    `<label><input type="checkbox" onchange="toggleSet(state.brands,'${esc(b)}',this.checked)"> ${esc(b)} <span style="color:var(--muted)">(${P.filter(p => p.brand === b).length})</span></label>`).join("");
  const sizes = [...new Set(P.flatMap(p => p.sizes || []))].sort();
  document.getElementById("fSizes").innerHTML = sizes.map(s =>
    `<label><input type="checkbox" onchange="toggleSet(state.sizes,'${s}',this.checked)"> EU ${s}</label>`).join("");
  document.getElementById("fSale").checked = state.sale;
  document.getElementById("q").value = state.q;
}
function toggleSet(set, v, on) { on ? set.add(isNaN(v) ? v : v) : set.delete(v); render(); }
function clearFilters() { state.cats.clear(); state.brands.clear(); state.sizes.clear(); state.sale = false; state.stock = false; state.q = ""; buildFilters(); document.getElementById("fStock").checked = false; render(); }
document.getElementById("fStock").addEventListener("change", e => { state.stock = e.target.checked; render(); });
document.getElementById("fSale").addEventListener("change", e => { state.sale = e.target.checked; render(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.toLowerCase(); render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
let shown = 60, currentList = [];
function more() { shown += 60; paint(); }
function paint() {
  document.getElementById("grid").innerHTML = currentList.slice(0, shown).map(cardHTML).join("");
  document.getElementById("count").textContent = currentList.length + " products";
  document.getElementById("empty").style.display = currentList.length ? "none" : "block";
  document.getElementById("loadMore").style.display = currentList.length > shown ? "inline-flex" : "none";
}
function render() {
  shown = 60;
  let list = P.filter(p =>
    (!state.cats.size || state.cats.has(p.category)) &&
    (!state.brands.size || state.brands.has(p.brand)) &&
    (!state.sizes.size || (p.sizes || []).some(s => state.sizes.has(String(s)))) &&
    (!state.stock || p.available !== false) &&
    (!state.sale || disc(p) > 0) &&
    (!state.q || (p.name + " " + (p.brand || "") + " " + (p.category || "")).toLowerCase().includes(state.q))
  );
  if (state.sort === "low") list.sort((a, b) => a.price - b.price);
  if (state.sort === "high") list.sort((a, b) => b.price - a.price);
  if (state.sort === "disc") list.sort((a, b) => disc(b) - disc(a));
  if (state.sort === "az") list.sort((a, b) => a.name.localeCompare(b.name));
  currentList = list; paint();
}
buildFilters();
if (!P.some(p => (p.sizes || []).length)) document.getElementById("sizeBlock").style.display = "none";
render();
</script>
<style>@media(max-width:760px){#grid{grid-template-columns:repeat(2,1fr)!important}}</style>
</body>
</html>
